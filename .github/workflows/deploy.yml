# Project Hub — continuous publishing pipeline (Droplet 0.1.6.2)
#
# Every push to main: validate → build → deploy to GitHub Pages.
# Documentation updated in Obsidian → committed → pushed → live website.
# Build/validation failures stop the pipeline; the previous deployment stays live.
#
# One-time repository setup: Settings → Pages → Source: "GitHub Actions".

name: Deploy Project Hub

on:
  push:
    branches: [main]
  # Manual runs (e.g. re-deploy without a content change)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let in-flight production deploys finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate (astro check)
        run: npm run check

      - name: Build (astro build + search index)
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
